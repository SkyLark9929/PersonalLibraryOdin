<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="source.js" defer></script>
</head>
<body>
    <header>
        <img src="assets/icons/header.svg" alt="Personal Library Logo" class="library-logo">
    </header>
    <main>
        <div class="searchbar-container">
            <input type="text" name="searchbar" class="searchbar" placeholder="SEARCH BY AUTHOR OR TITLE"/>
            <button class="search-button"><img src="assets/icons/magnify.svg" alt="search" class="icon"></button>
            <!-- <button class="filter-button"><img src="assets/icons/filter-outline.svg" alt="filter" class="icon"></button> -->
        </div>
        <button class="add-book"><img src="assets/icons/plus.svg" alt="add book" class="icon"></button>
    <dialog class="add-book-dialog">
        <form method="dialog">
            <fieldset>
                <label for="title-add">TITLE:</label>
                <input type="text" id="title-add" name="title" placeholder="BROTHERS KARAMAZOV">
            </fieldset>
            <fieldset>
                <label for="author-add">AUTHOR: </label>
                <input type="text" id="author-add" name="author" placeholder="F.M. DOSTOEVSKIY">
            </fieldset>
            <fieldset>
                <label for="number-of-pages-add">NUMBER OF PAGES:</label>
                <input type="number" id="number-of-pages-add" name="number-of-pages" placeholder="3465">
            </fieldset>
            <fieldset>
                <label for="status-add">STATUS:</label>
                <select name="status" id="status-add">
                    <option value="UNREAD">UNREAD</option>
                    <option value="INPROGRESS">INPROGRESS</option>
                    <option value="FINISHED">FINISHED</option>
                </select>
            </fieldset>
            <fieldset>
                <label for="completed-pages-add">COMPLETED PAGES:</label>
                <input type="number" id="completed-pages-add" name="completed-pages" placeholder="165">
            </fieldset>
            <button class="confirm-add-book">ADD BOOK</button>
            <button class="cancel-add-book">CANCEL</button>
        </form>
    </dialog>
    <dialog class="edit-book-dialog">
        <form method="dialog">
            <fieldset>
                <label for="title-edit">TITLE:</label>
                <input type="text" id="title-edit" name="title">
            </fieldset>
            <fieldset>
                <label for="author-edit">AUTHOR: </label>
                <input type="text" id="author-edit" name="author">
            </fieldset>
            <fieldset>
                <label for="number-of-pages-edit">NUMBER OF PAGES:</label>
                <input type="number" id="number-of-pages-edit" name="number-of-pages">
            </fieldset>
            <fieldset>
                <label for="status-edit">STATUS:</label>
                <select name="status" id="status-edit">
                    <option value="UNREAD">UNREAD</option>
                    <option value="INPROGRESS">INPROGRESS</option>
                    <option value="FINISHED">FINISHED</option>
                </select>
            </fieldset>
            <fieldset>
                <label for="completed-pages-edit">COMPLETED PAGES:</label>
                <input type="number" id="completed-pages-edit" name="completed-pages">
            </fieldset>
            <button class="confirm-edit-book">EDIT BOOK</button>
            <button class="cancel-edit-book">CANCEL</button>
        </form>
    </dialog>
    <dialog class="are-you-sure">
        <form method="dialog">
            <h1>Are you sure you want to delete the book?</h1>
            <fieldset>
                <button id="yes-im-sure" value="yes">YES</button>
                <button id="NO" value="no">NO</button>
            </fieldset>
        </form>
    </dialog>
    <dialog class="fill-with-books">
        <form method="dialog">
            <h1>Do you wish for the library to be pre-filled with books?</h1>
            <button id="yes-fill" value="yes">YES</button>
            <button id="NO" value="no">NO</button>
        </form>
    </dialog>
    </main>
    <footer>
        <p>This website is a personal library website. 
            It was created as a solution to one of the tasks of "THE ODIN PROJECT" web development course.</p>
    </footer>
</body>
</html>
